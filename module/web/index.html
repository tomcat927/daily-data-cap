<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyCap 流量日帽</title>
<style>
body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;display:flex;justify-content:center}
.card{width:100%;max-width:420px;padding:24px;box-sizing:border-box}
.bar{background:#333;border-radius:8px;height:14px;overflow:hidden;margin:10px 0}
.bar>div{background:linear-gradient(90deg,#2fb344,#e5c840);height:100%;transition:width .5s}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;background:#2fb344;color:#fff;vertical-align:middle}
.btn{display:inline-block;margin:6px 6px 0 0;padding:10px 14px;border-radius:8px;background:#2c2c2c;color:#eee;text-decoration:none;font-size:14px;cursor:pointer}
.btn.go{background:#2fb344;color:#fff}.btn.stop{background:#e5484d;color:#fff}
#bars>div{flex:1;background:#2fb344;min-height:2px;border-radius:2px 2px 0 0}
#bars>div.hit{background:#e5484d}
input{padding:8px;border-radius:6px;border:1px solid #444;background:#222;color:#eee;box-sizing:border-box}
button{padding:9px 14px;border-radius:6px;border:0;background:#4a6cf7;color:#fff;cursor:pointer}
.small{color:#888;font-size:12px;margin-top:16px;line-height:1.8}
h1{font-size:20px}b{font-size:34px}
</style></head><body><div class="card">

<div id="auth" style="display:none">
  <h1>流量日帽</h1>
  <p>首次使用请输入访问码（默认 <b>1234</b>，可在面板里修改）：</p>
  <input id="tin" style="width:100%" placeholder="访问码" autocomplete="off">
  <p><button id="saveT">进入面板</button></p>
</div>

<div id="main" style="display:none">
  <h1>流量日帽 <span class="badge" id="badge">…</span></h1>
  <p>今日 <b id="u">0.0</b> / <span id="tmb">?</span> MB</p>
  <div class="bar"><div id="bar" style="width:0%"></div></div>
  <div id="btns"></div>
  <p><a class="btn" id="resetBtn">清零计数</a><a class="btn" id="chpwBtn">修改访问码</a><a class="btn" id="calibBtn" style="display:none">立即对账</a></p>
  <form id="tf">
    <input type="number" id="v" min="50" max="2000" style="width:90px">
    <button type="submit">保存阈值</button>
  </form>
  <p class="small" id="iface"></p>
  <p class="small" id="calibLine" style="display:none"></p>
  <p class="small"><a class="btn" id="statsBtn" style="font-size:12px;padding:6px 10px">📊 近30天统计</a></p>
  <div id="statsBox" style="display:none;background:#1a1a1a;border-radius:8px;padding:12px;margin-top:8px">
    <div id="bars" style="display:flex;align-items:flex-end;gap:2px;height:80px"></div>
    <p class="small" style="margin:6px 0 0">每天一根柱：高度=用量/阈值，<span style="color:#e5484d">红色=当天触发过断网</span>，悬停看详情</p>
    <p class="small" style="margin:10px 0 2px"><b>📱 今日应用排行</b> <span id="topappsTotal" style="color:#888"></span></p>
    <div id="topapps"><p class="small" style="margin:0">加载中…</p></div>
    <pre class="small" id="evts" style="white-space:pre-wrap;margin:10px 0 0"></pre>
  </div>
  <p class="small">每天 0 点自动清零并恢复网络 · 每 5 秒自动刷新</p>
</div>

</div>
<script>
const $=i=>document.getElementById(i);
let T=localStorage.getItem('dailycap_t')||'';
function show(){
  $('auth').style.display=T?'none':'block';
  $('main').style.display=T?'block':'none';
}
$('saveT').onclick=()=>{
  const v=$('tin').value.trim();
  if(!v)return;
  T=v; localStorage.setItem('dailycap_t',v);
  show(); poll();
};
async function act(q){
  try{ await fetch('/cgi-bin/action?t='+encodeURIComponent(T)+(q||'')); }catch(e){}
  poll();
}
$('btns').addEventListener('click',e=>{
  const a=e.target.closest('a');
  if(!a)return;
  e.preventDefault();
  act(a.dataset.q);
});
$('resetBtn').onclick=()=>{ if(confirm('确定清零今日计数?')) act('&do=reset'); };
$('statsBtn').onclick=async()=>{
  const box=$('statsBox');
  if(box.style.display==='block'){ box.style.display='none'; return; }
  box.style.display='block';
  try{
    const r=await fetch('/cgi-bin/action?t='+encodeURIComponent(T)+'&fmt=stats');
    const j=await r.json();
    const th=parseFloat($('tmb').textContent)||900;
    const days=(j.days||'').split(';').filter(Boolean);
    let h='';
    for(const line of days){
      const p=line.split(',');
      if(p.length<6)continue;
      const pct=Math.min(100,parseFloat(p[1])/th*100);
      const tip=p[0]+': '+p[1]+'MB (营业厅'+p[2]+'MB, 偏差'+p[3]+', 触发'+p[4]+'次 解除'+p[5]+'次)';
      h+='<div class="'+(p[4]!=='0'?'hit':'')+'" style="height:'+Math.max(2,pct)+'%" title="'+tip+'"></div>';
    }
    $('bars').innerHTML=h||'<p class="small" style="margin:0">还没有归档数据(每天0点生成一条)</p>';
    $('evts').textContent=(j.events||'').split('~').filter(Boolean).join('\n')||'暂无事件';
  }catch(e){}
  // 应用排行: 独立接口, 慢(1~3s), 失败不打断统计
  try{
    const r2=await fetch('/cgi-bin/action?t='+encodeURIComponent(T)+'&fmt=topapps');
    const j2=await r2.json();
    const rows=(j2.topapps||'').split(';').filter(x=>x&&x.indexOf(':')>0);
    let h2='';
    if(rows.length===0){ h2='<p class="small" style="margin:0">暂无应用流量记录</p>'; }
    else{
      for(const it of rows){
        const ci=it.lastIndexOf(':');
        const n=it.slice(0,ci), v=parseFloat(it.slice(ci+1));
        h2+='<div style="display:flex;margin:3px 0;font-size:12px">'+
            '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px">'+n+'</span>'+
            '<span style="color:#2fb344;min-width:64px;text-align:right">'+v+' MB</span></div>';
      }
    }
    $('topapps').innerHTML=h2;
    $('topappsTotal').textContent='合计 '+(j2.total_mb||'0')+' MB（本地口径，自上次开机）';
  }catch(e){
    $('topapps').innerHTML='<p class="small" style="margin:0">应用排行加载失败</p>';
  }
};
$('calibBtn').onclick=()=>{
  $('calibBtn').textContent='对账中…';
  act('&do=calib');
  setTimeout(poll, 8000);
};
$('chpwBtn').onclick=()=>{
  const v=prompt('新的访问码 (4-16 位字母或数字)');
  if(!v)return;
  if(!/^[A-Za-z0-9]{4,16}$/.test(v)){ alert('格式不对: 4-16 位字母或数字'); return; }
  T=v; localStorage.setItem('dailycap_t',v);
  act('&do=settoken&v='+encodeURIComponent(v));
};
$('tf').onsubmit=e=>{ e.preventDefault(); act('&do=setthresh&v='+$('v').value); };
async function poll(){
  if(!T)return;
  try{
    const r=await fetch('/cgi-bin/action?t='+encodeURIComponent(T)+'&fmt=json');
    const txt=await r.text();
    if(txt.indexOf('403')===0){ T=''; localStorage.removeItem('dailycap_t'); show(); return; }
    const j=JSON.parse(txt);
    $('u').textContent=j.used_mb;
    $('tmb').textContent=j.threshold_mb;
    $('v').value=j.threshold_mb;
    $('bar').style.width=Math.min(100,j.used_mb*100/j.threshold_mb)+'%';
    let bg='#f5a623', bt='已解除 '+(j.mode||'');
    if(j.state==='ACTIVE'){ bg='#2fb344'; bt='计数中 ACTIVE'; }
    if(j.state==='BLOCKED'){ bg='#e5484d'; bt='已断网 BLOCKED'; }
    $('badge').textContent=bt; $('badge').style.background=bg;
    let h='';
    if(j.state==='BLOCKED') h=
      '<a class="btn go" data-q="&do=lift_midnight">当日放开</a>'+
      '<a class="btn go" data-q="&do=lift_hardcap">到 '+j.hardcap_mb+'MB 再断</a>'+
      '<a class="btn go" data-q="&do=lift_min&min=30">30分钟后再断</a>';
    if(j.state==='LIFTED') h='<a class="btn stop" data-q="&do=block">立即重新断网</a>';
    $('btns').innerHTML=h;
    $('iface').textContent='数据接口: '+(j.iface||'无');
    if(j.calib_on){
      $('calibBtn').style.display='inline-block';
      $('calibLine').style.display='block';
      if(j.carrier_used!==''){
        const d=parseFloat(j.diff);
        let col=d>50?'#e5484d':(d<-50?'#f5a623':'#888');
        $('calibLine').style.color=col;
        $('calibLine').textContent='营业厅对账: '+j.carrier_used+'MB 已用 / 剩'+j.carrier_remain+
          'MB ('+j.calib_time+') ｜ 与本地偏差 '+(d>0?'+':'')+d+'MB';
        $('calibBtn').textContent='立即对账';
      } else {
        $('calibLine').style.color='#888';
        $('calibLine').textContent='营业厅对账: 已启用, 尚无数据(点"立即对账"试一次)';
      }
    } else {
      $('calibBtn').style.display='none';
      $('calibLine').style.display='none';
    }
  }catch(e){ $('badge').textContent='连接失败'; }
}
show(); poll(); setInterval(poll,5000);
</script>
</body></html>
